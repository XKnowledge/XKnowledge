<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 170" width="100%" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">视频录制管线：画布帧合成、编码到落盘</title>
  <desc id="d">three 画布每帧 rAF 送入离屏合成 canvas（叠加水印），经 captureStream(30) 交给 MediaRecorder 编码为 Blob，经 video:save IPC 由主进程弹保存框写盘。环绕动画与实时录屏两种模式共用此管线。</desc>
  <style>
    text { fill: var(--fg); }
    .cap { font-size: 12.5px; fill: var(--fg2); }
    .name { font-size: 13.5px; font-weight: 600; fill: var(--ren); }
    .name-main { fill: var(--main); }
    .desc { font-size: 11px; fill: var(--fg2); }
    .edge-lbl { font-size: 11.5px; fill: var(--fg2); }
    .edge-lbl-pre { fill: var(--pre); font-weight: 600; }
    .ln { fill: none; stroke: var(--line2); stroke-width: 1.4; marker-end: url(#ah); }
    .ln-pre { stroke: var(--pre); }
    .box-ren { fill: var(--ren-bg); stroke: var(--ren); stroke-width: 1.4; }
    .box-main { fill: var(--main-bg); stroke: var(--main); stroke-width: 1.4; }
    .mk { fill: var(--line2); } .mk-pre { fill: var(--pre); }
    svg { --fg: #1f2328; --fg2: #59636e; --line2: #8c959f;
      --ren: #1a7f37; --ren-bg: #1a7f3712; --main: #0969da; --main-bg: #0969da14; --pre: #8250df; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6edf3; --fg2: #9198a1; --line2: #6e7681;
        --ren: #3fb950; --ren-bg: #3fb9501a; --main: #4493f8; --main-bg: #4493f81f; --pre: #ab7df8; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="mk"/>
    </marker>
    <marker id="ah-pre" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="mk-pre"/>
    </marker>
  </defs>

  <text x="490" y="28" text-anchor="middle" class="cap">两种视频导出（环绕动画 / 实时录屏）共用一条录制管线</text>

  <rect x="30"  y="56" width="190" height="78" rx="8" class="box-ren"/>
  <text x="125" y="88" text-anchor="middle" class="name">three 画布</text>
  <text x="125" y="112" text-anchor="middle" class="desc">每帧渲染场景</text>

  <rect x="270" y="56" width="190" height="78" rx="8" class="box-ren"/>
  <text x="365" y="88" text-anchor="middle" class="name">离屏合成 canvas</text>
  <text x="365" y="112" text-anchor="middle" class="desc">画布帧 + 水印（单源样式）</text>

  <rect x="510" y="56" width="190" height="78" rx="8" class="box-ren"/>
  <text x="605" y="88" text-anchor="middle" class="name">MediaRecorder</text>
  <text x="605" y="112" text-anchor="middle" class="desc">编码为视频 Blob</text>

  <rect x="750" y="56" width="190" height="78" rx="8" class="box-main"/>
  <text x="845" y="88" text-anchor="middle" class="name name-main">主进程</text>
  <text x="845" y="112" text-anchor="middle" class="desc">保存框选择位置落盘</text>

  <path d="M 224 95 L 262 95" class="ln"/>
  <text x="243" y="50" text-anchor="middle" class="edge-lbl">每帧 rAF</text>
  <path d="M 464 95 L 502 95" class="ln"/>
  <text x="483" y="50" text-anchor="middle" class="edge-lbl">captureStream(30)</text>
  <path d="M 704 95 L 742 95" class="ln ln-pre" marker-end="url(#ah-pre)"/>
  <text x="723" y="50" text-anchor="middle" class="edge-lbl-pre">Blob → IPC</text>
</svg>
