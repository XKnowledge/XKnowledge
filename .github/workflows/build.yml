name: Release Build

on:
  push:
    tags:
      - 'v*'  # 监听所有以 v 开头的标签，如 v1.0.0、v2.1.3

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: 关闭 git 行尾自动转换
        run: git config --global core.autocrlf false
        # windows runner 默认 autocrlf=true，checkout 会把仓库 LF 文件转成 CRLF，
        # 「清单同步守护」测试做逐字节对比会被误伤（本地不转换所以全绿）

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 安装依赖
        run: |
          # CI 在海外，删掉本地 .npmrc 的国内镜像配置，直连官方源下载 electron 二进制
          rm .npmrc
          yarn install --frozen-lockfile

      - name: 运行测试
        run: yarn test

      - name: 类型检查
        run: yarn typecheck

      - name: 构建项目
        run: yarn build:win

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
