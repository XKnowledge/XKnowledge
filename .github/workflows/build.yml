name: Release Build

on:
  push:
    tags:
      - 'v*'  # 监听所有以 v 开头的标签，如 v1.0.0、v2.1.3

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # 单平台失败不取消其他平台，便于定位
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            artifact_glob: release/*.exe
          - os: macos-latest
            build_script: build:mac
            artifact_glob: release/*.dmg
          - os: ubuntu-latest
            build_script: build:linux
            artifact_glob: release/*.AppImage

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 安装依赖
        run: |
          rm .npmrc
          yarn install --frozen-lockfile

      - name: 运行测试
        run: yarn test

      - name: 类型检查
        run: yarn typecheck

      - name: 构建安装包
        run: yarn ${{ matrix.build_script }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
